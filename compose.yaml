name: aksorn-backend-assessment
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
      POSTGRES_DB: assessment
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "${MIGRATION_DATABASE_URL:-postgres://assessment:assessment@postgres:5432/assessment?sslmode=disable}"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
